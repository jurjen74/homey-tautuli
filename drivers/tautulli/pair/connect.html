<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #fff;
      padding: 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: #e5a00d;
      border-radius: 50%;
      padding: 14px;
      color: #fff;
    }

    h2 {
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 24px;
      font-size: 13px;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 4px;
      color: #333;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 14px;
    }

    input:focus {
      border-color: #e5a00d;
    }

    input.error {
      border-color: #ef4444;
    }

    input.success {
      border-color: #22c55e;
    }

    .hint {
      font-size: 12px;
      color: #888;
      margin-top: -10px;
      margin-bottom: 14px;
    }

    .status-box {
      display: none;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .status-box.error {
      display: block;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #b91c1c;
    }

    .status-box.success {
      display: block;
      background: #f0fdf4;
      border: 1px solid #86efac;
      color: #15803d;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    button {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, background 0.15s;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #btn-test {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #d1d5db;
    }

    #btn-test:not(:disabled):hover {
      background: #e5e7eb;
    }

    #btn-next {
      background: #e5a00d;
      color: #fff;
    }

    #btn-next:not(:disabled):hover {
      background: #c88a0a;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor" style="width:100%;height:100%;">
      <path d="M380.6 344.1c-14.8 0-27.5 8.6-33.5 21.1l-53.2-7.7c-.2-20.3-16.7-36.8-37.1-36.8-7.3 0-14 2.1-19.8 5.7l-75.6-85.6c4.4-6.1 6.9-13.5 6.9-21.6 0-20.5-16.6-37.1-37.1-37.1s-37.1 16.6-37.1 37.1 16.6 37.1 37.1 37.1c6.3 0 12.3-1.6 17.5-4.4l76.4 86.5c-3.4 5.6-5.4 12.2-5.4 19.3 0 20.5 16.6 37.1 37.1 37.1 14.7 0 27.4-8.5 33.4-20.9l53.3 7.7c.3 20.2 16.8 36.5 37.1 36.5 20.5 0 37.1-16.6 37.1-37.1.1-20.3-16.6-36.9-37.1-36.9"/>
      <path d="M380.6 93.7c-20.5 0-37.1 16.6-37.1 37.1 0 10.1 4 19.2 10.6 25.9L271.8 273c-4.6-2-9.6-3.1-15-3.1-20.5 0-37.1 16.6-37.1 37.1q0 5.55 1.5 10.5l-62.5 38.7c-6.8-7.4-16.6-12.1-27.4-12.1-20.5 0-37.1 16.6-37.1 37.1s16.6 37.1 37.1 37.1 37.1-16.6 37.1-37.1c0-3.5-.5-7-1.4-10.2l62.6-38.8c6.8 7.3 16.5 11.9 27.2 11.9 20.5 0 37.1-16.6 37.1-37.1 0-9-3.2-17.3-8.6-23.8l83-117.3c3.8 1.3 7.9 2.1 12.2 2.1 20.5 0 37.1-16.6 37.1-37.1s-16.5-37.2-37-37.2"/>
    </svg>
  </div>
  <h2 id="title"></h2>
  <p class="subtitle" id="subtitle"></p>

  <label for="host" id="label-host"></label>
  <input id="host" type="text" autocomplete="off" spellcheck="false" />
  <p class="hint" id="hint-host"></p>

  <label for="apiKey" id="label-apikey"></label>
  <input id="apiKey" type="password" autocomplete="off" />

  <div id="status" class="status-box"></div>

  <div class="actions">
    <button id="btn-test" type="button"></button>
    <button id="btn-next" type="button" disabled></button>
  </div>

  <script>
    const hostInput = document.getElementById('host');
    const keyInput  = document.getElementById('apiKey');
    const statusBox = document.getElementById('status');
    const btnTest   = document.getElementById('btn-test');
    const btnNext   = document.getElementById('btn-next');

    document.getElementById('title').textContent        = Homey.__('pair.connect.title');
    document.getElementById('subtitle').textContent     = Homey.__('pair.connect.subtitle');
    document.getElementById('label-host').textContent   = Homey.__('pair.connect.label_host');
    document.getElementById('hint-host').textContent    = Homey.__('pair.connect.hint_host');
    document.getElementById('label-apikey').textContent = Homey.__('pair.connect.label_apikey');
    hostInput.placeholder                               = Homey.__('pair.connect.placeholder_host');
    keyInput.placeholder                                = Homey.__('pair.connect.placeholder_apikey');
    btnTest.textContent                                 = Homey.__('pair.connect.btn_test');
    btnNext.textContent                                 = Homey.__('pair.connect.btn_next');

    function setStatus(type, message) {
      statusBox.className = 'status-box ' + type;
      statusBox.textContent = message;
    }

    function clearStatus() {
      statusBox.className = 'status-box';
      statusBox.textContent = '';
    }

    function setInputState(inputEl, state) {
      inputEl.classList.remove('error', 'success');
      if (state) inputEl.classList.add(state);
    }

    function setLoading(loading) {
      btnTest.disabled = loading;
      if (loading) {
        btnTest.innerHTML = '<span class="spinner"></span>' + Homey.__('pair.connect.btn_testing');
      } else {
        btnTest.textContent = Homey.__('pair.connect.btn_test');
      }
    }

    async function testConnection() {
      const host   = hostInput.value.trim();
      const apiKey = keyInput.value.trim();

      if (!host) {
        setInputState(hostInput, 'error');
        setStatus('error', Homey.__('pair.connect.error_host_required'));
        hostInput.focus();
        return;
      }

      if (!apiKey) {
        setInputState(keyInput, 'error');
        setStatus('error', Homey.__('pair.connect.error_apikey_required'));
        keyInput.focus();
        return;
      }

      clearStatus();
      setInputState(hostInput, null);
      setInputState(keyInput, null);
      btnNext.disabled = true;
      setLoading(true);

      try {
        await Homey.emit('test_connection', { host, apiKey });
        setInputState(hostInput, 'success');
        setInputState(keyInput, 'success');
        setStatus('success', Homey.__('pair.connect.success_connected'));
        btnNext.disabled = false;
      } catch (err) {
        setInputState(hostInput, 'error');
        setInputState(keyInput, 'error');
        setStatus('error', err.message || Homey.__('pair.connect.error_connection_failed'));
        btnNext.disabled = true;
      } finally {
        setLoading(false);
      }
    }

    btnTest.addEventListener('click', testConnection);

    btnNext.addEventListener('click', () => {
      Homey.nextView();
    });

    keyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') testConnection();
    });

    function onInputChange() {
      btnNext.disabled = true;
      setInputState(hostInput, null);
      setInputState(keyInput, null);
      clearStatus();
    }

    hostInput.addEventListener('input', onInputChange);
    keyInput.addEventListener('input', onInputChange);
  </script>
</body>
</html>
